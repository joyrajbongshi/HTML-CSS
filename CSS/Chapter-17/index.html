<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Position</title>

    <style>


        img {
            margin: 20px;
            padding: 30px;
        }

        .img2{
            position: relative;
            
        }
        .container{
            position: relative;
            height: 5000px;
            background-color: beige;
        }
        .img2{
            position: fixed;
        }

    </style>


  </head>
  <body>
    <div class="container">
      <img src="img1.jpg" alt="image1" width="350px" height="500px" class="img1"/>

      <img src="img2.jpg" alt="image2" width="350px" height="500px" class="img2"/>

      <img src="img3.jpg" alt="image3" width="350px" height="500px" class="img3"/>

      <img src="img4.jpg" alt="image4" width="350px" height="500px" class="img4"/>

    </div>
  </body>
</html>
