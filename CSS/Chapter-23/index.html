<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation</title>

    <style>

        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .container{
            width: 100vw;
            height: 100vh;
            background-color: bisque;
            border: 5px solid black;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .box1 {
            width: 350px;
            height: 80px;
            background-color: red;
            border: 5px solid green;
            border-radius: 100px;
            margin: 10px;
            position: relative;
            /* animation-name: rightMovement; */
            /* animation-duration: 2s;
            animation-iteration-count: infinite;
            /* animation-delay: 2s; */
            /* animation-timing-function: linear;
            animation-direction: alternate; */

            /* animation-fill-mode: both; */
            /* Duration | easing-function | delay | iteration-count | direction | fill-mode | play-state | name */
            animation: 2s linear 0s infinite alternate none running rightMovement;
        }
        .box1 h1{
            text-align: center;
            padding: 15px;
        }
        @keyframes rightMovement {

            from{
                top: 0;
                left: 0;
            }

            to{
                top: 0;
                left: 400px;
            }

        }
        .box2 {
            width: 350px;
            height: 80px;
            background-color: red;
            border: 5px solid green;
            border-radius: 100px;
            margin: 10px;
            position: relative;
            /* Duration | easing-function | delay | iteration-count | direction | fill-mode | play-state | name */
            animation: 2s linear 0s infinite alternate-reverse none running rightMovement;
        }
        .box2 h1{
            text-align: center;
            padding: 15px;
        }

    </style>
</head>
<body>
    
    <div class="container">

        <div class="box1">
            <h1>Joy</h1>
        </div>

        <div class="box2">
            <h1>Rajbongshi</h1>
        </div>

    </div>


</body>
</html>
