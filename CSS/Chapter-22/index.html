<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Effect</title>


    <style>

        .container{
            background-color: bisque;
            height: 650px;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background-color: aquamarine;
            width: 400px;
            height: 400px;
            border: 1px solid brown;
            margin: 5px;
            padding: 5px;
            /* box-shadow: 20px 15px brown; */
            box-shadow: 10px 15px 100px rgb(201, 39, 39);
            /* box-shadow: 15px 24px 12px 30px greenyellow; */
            /* box-shadow: inset 10px 15px brown; */
        }

        #image1{
            width: 200px;
            height: 200px;
            display: block;
            margin: 0 auto;
        }

        .box h2{
            text-align: center;
            text-shadow: 
            5px 3px 6px white,
            2px 3px 5px red,
            15px 13px 3px green;

        }

    </style>
</head>
<body>
    
    <div class="container">

        <div class="box">

            <h2>
                The Morning Nature Beauty View
            </h2>

            <img src="img1.jpg" alt="img1" id="image1">
            
            <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Odit nam sapiente neque nemo incidunt animi eius porro labore consectetur, laborum, accusantium quis! Perferendis, ut eveniet! Sint corrupti assumenda at nostrum.

            </p>

        </div>

    </div>


</body>
</html>
