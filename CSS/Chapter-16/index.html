<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Property</title>


    <style>
        
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        
        /* div{
            border: 1px solid red;
            width: 300px;
            height: 300px;
            margin: 25px;    
        } */


        .box {
            width: 300px;
            height: 300px;
            border: 1px solid black;
            padding: 100px;
        }

        span {
            border: 2px solid green;
            width: 200px;
            height: 100px;
            margin: 10px;
            display: block;
        }



    </style>
</head>
<body>
    

    <!-- <div>

    </div>

     <div>
        B.Sc. in Computer Science & Engineering.
    </div> -->

    <div class="box">
        My Name is Joy Rajbongshi
    </div>

    <span>
        Joy Rajbongshi
    </span>
    
    <span>
        B.Sc in Computer Science & Engineering.
    </span>

</body>
</html>
