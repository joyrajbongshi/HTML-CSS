<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
        }

        .container{
            width: 100%;
            height: 100%;
            background-color: rgb(160, 157, 157);
            display: grid;
            padding: 4rem;
            row-gap: 1rem;
            column-gap: 1rem;
            grid-template-areas: 
                "header header header"
                "slidebar content1 content1"
                "slidebar content2 content3"
                "footer footer footer"
            ;
        }

        .item{
            background-color: rgb(101, 23, 32);
            border: 5px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;

        }
        #header {
            grid-area: header;
        }
        #slidebar {
            grid-area: slidebar;
        }
        #content1{
            grid-area: content1;
        }
        #content2{
            grid-area: content2;
        }
        #content3{
            grid-area: content3;
        }

        #footer {
            grid-area: footer;
        }




    </style>


</head>
<body>
    
    
    <div class="container">

        <div class="item" id="header">Header</div>
        <div class="item" id="slidebar">Slidebar</div>
        <div class="item" id="content1">Content1</div>
        <div class="item" id="content2">Content2</div>
        <div class="item" id="content3">Content3</div>
        <div class="item" id="footer">Footer</div> 

    </div>

</body>
</html>
