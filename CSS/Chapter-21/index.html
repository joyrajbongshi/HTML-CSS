<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>

    <style>
        .box{
            height: 400px;
            width: 400px;
            background-color: aqua;
            border: 3px solid black;
            
        }
        @media (max-width: 700px) and (min-width:500px) {
            .box {
                background: green;
            }
        }
    </style>

</head>
<body>
    
    <div class="box">
        Hello World!
    </div>


</body>
</html>
