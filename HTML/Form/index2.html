<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
  </head>
  <body>
    <fieldset>
      <legend>Event Registration</legend>
      <label for="name">Name : </label>
      <br />
      <input type="text" id="name" />
      <br />
      <br />
      <label for="email">Email : </label>
      <input type="text" id="email" />
      <br />
      <br />
      <label for="phone">Phone : </label>
      <input type="text" id="phone" />
      <br />
      <br />
      <label for="occpuation">Occupation : </label>
      <select name="occpuation" id="occ">
        <option value="front">Frontend Developer</option>
        <option value="back">Backend Developer</option>
        <option value="full">Fullstack Developer</option>
        <option value="others">Others</option>
      </select>
      <br />
      <br />
      <label for="topic">Topics of Interest: </label>
      <br />
      <br />
      <label for="html">HTML</label>
      <input type="checkbox" id="html" value="HTML" />
      <br />
      <br />
      <label for="css">CSS</label>
      <input type="checkbox" id="css" value="CSS" />
      <br />
      <br />
      <label for="javascript">Javascript</label>
      <input type="checkbox" id="javascript" value="Javascript" />
      <br />
      <br />
      <label for="cmt">Comment:</label>
      <br />
      <textarea
        name="commnet"
        id="cmt"
        cols="30px"
        rows="10px"
        placeholder="Enter the commnet..."
      ></textarea>
      <br />
      <button>Register</button>
    </fieldset>
  </body>
</html>
